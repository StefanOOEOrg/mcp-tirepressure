[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tirepressure"
version = "0.1.0"
description = "MCP server implementing a SRAM-like tire pressure formula (local, keyless)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StefanOOEOrg" }]
keywords = ["mcp", "model-context-protocol", "tire-pressure", "sram-like", "cycling"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["mcp>=2.0", "httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/StefanOOEOrg/mcp-tirepressure"
Issues = "https://github.com/StefanOOEOrg/mcp-tirepressure/issues"

[project.scripts]
mcp-tirepressure = "mcp_tirepressure.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tirepressure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]